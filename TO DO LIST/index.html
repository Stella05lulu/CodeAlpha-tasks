<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <header>
      <h1>&#9998; My To-Do List</h1>
      <p class="subtitle">Stay organized, stay productive</p>
    </header>

    <section class="input-section">
      <form id="task-form">
        <input
          type="text"
          id="task-input"
          placeholder="Add a new task..."
          autocomplete="off"
          maxlength="120"
        />
        <button type="submit" id="add-btn">Add Task</button>
      </form>
    </section>

    <section class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </section>

    <section class="task-list-section">
      <ul id="task-list"></ul>
      <p id="empty-msg" class="empty-msg">No tasks yet. Add one above!</p>
    </section>

    <footer class="app-footer">
      <span id="task-count">0 tasks remaining</span>
      <button id="clear-completed-btn">Clear Completed</button>
    </footer>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Edit Task</h2>
      <input type="text" id="edit-input" maxlength="120" />
      <div class="modal-actions">
        <button id="save-edit-btn">Save</button>
        <button id="cancel-edit-btn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
